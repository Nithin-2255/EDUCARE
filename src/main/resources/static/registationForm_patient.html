<!DOCTYPE html>
<html>
<head>
<meta charset="ISO-8859-1">
 <title>Patient Registration</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh; /* Change from height: 100vh to min-height */
            background: linear-gradient(135deg, #74ebd5, #acb6e5);
            font-family: 'Poppins', sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px; /* Add padding to prevent cut-off content */
            overflow-y: auto; /* Enable vertical scrolling */
        }
        
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            animation: fadeIn 1s ease-in-out;
            width: 90%;
            max-width: 400px;
        }
        
        h2 {
            font-size: 22px;
            margin-bottom: 15px;
            color: #2c3e50;
        }
        .form-section {
            margin-bottom: 20px;
            text-align: left;
        }
        .form-section h3 {
            font-size: 18px;
            color: #2c3e50;
            border-bottom: 2px solid #2c3e50;
            padding-bottom: 5px;
            margin-bottom: 10px;
        }
        .form-group {
            margin-bottom: 10px;
        }
        label {
            font-size: 14px;
            color: #2c3e50;
        }
        input, select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }
        .btn {
            padding: 10px;
            font-size: 16px;
            border: none;
            cursor: pointer;
            border-radius: 50px;
            transition: 0.3s;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #3498db, #6dd5fa);
            width: 100%;
        }
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
    
        <h2>Patient Registration</h2>
        <center>  <img src="img/midhunlogo final.png" alt="" width="200px"> </center>
        <form action="reg" method="post" enctype="multipart/form-data">
            <div class="form-section">
                <h3>Personal Details</h3>
                <div class="form-group">
                    <label>Name:</label>
                    <input type="text" required name="patientname">
                </div>
                
                <div class="form-group">
                    <label>Gender:</label>
                    <select required name="gender">
                        <option value="">Select</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Age:</label>
                    <input type="number" required name="patientage">
                </div>
                <div class="form-group">
                    <label>Blood Group:</label>
                    <input type="text" required name="bloodgroup">
                </div>
            </div>
            
            <div class="form-section">
                <h3>Contact Details</h3>
                <div class="form-group">
                    <label>Address:</label>
                    <input type="text" required name="address" >
                </div>
                <div class="form-group">
                    <label>Location:</label>
                    <input type="text" required name="location">
                </div>
                <div class="form-group">
                    <label>Phone No:</label>
                    <input type="tel" required name="phoneno">
                </div>
                <div class="form-group">
                    <label>Relative Name:</label>
                    <input type="text" required  name="relativename">
                </div>
                <div class="form-group">
                    <label>Relative Phone No:</label>
                    <input type="tel" required name="relativephone">
                </div>
                <div class="form-group">
                    <label>Relation :</label>
                    <input type="text" required name="relation">
                </div>
               
            </div>
            
            <div class="form-section">
                <h3>Security</h3>
                <div class="form-group">
                    <label>Email ID:</label>
                    <input type="email" required name="email">
                </div>
                <div class="form-group">
                    <label>Password:</label>
                    <input type="password" required >
                </div>
                <div class="form-group">
                    <label>Confirm Password:</label>
                    <input type="password" required name="password">
                </div>
                <div class="form-group">
                    <label>Uploade profile picture</label>
                    <input type="file" required name="file">
                </div>
            </div>
            
            <button type="submit" class="btn">Register</button>
        </form>
    </div>
</body>
</html>
