<!DOCTYPE html>
<html>
<head>
    <meta charset="ISO-8859-1">
    <title>Doctor Registration</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #74ebd5, #acb6e5);
            font-family: 'Poppins', sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            overflow-y: auto;
        }
        
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            animation: fadeIn 1s ease-in-out;
            width: 90%;
            max-width: 400px;
        }
        
        h2 {
            font-size: 22px;
            margin-bottom: 15px;
            color: #2c3e50;
        }
        .form-section {
            margin-bottom: 20px;
            text-align: left;
        }
        .form-section h3 {
            font-size: 18px;
            color: #2c3e50;
            border-bottom: 2px solid #2c3e50;
            padding-bottom: 5px;
            margin-bottom: 10px;
        }
        .form-group {
            margin-bottom: 10px;
        }
        label {
            font-size: 14px;
            color: #2c3e50;
        }
        input, select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }
        .btn {
            padding: 10px;
            font-size: 16px;
            border: none;
            cursor: pointer;
            border-radius: 50px;
            transition: 0.3s;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #2ecc71, #00b894);
            width: 100%;
        }
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Doctor Registration</h2>
        <center>  <img src="img/midhunlogo final.png" alt="" width="200px"> </center>
        <form action="docreg" method="post" enctype="multipart/form-data">
            <div class="form-section">
                <h3>Personal Details</h3>
                <div class="form-group">
                    <label>Name:</label>
                    <input type="text" required name="name">
                </div>
                <div class="form-group">
                    <label>Date of Birth:</label>
                    <input type="date" required name="dateOfBirth">
                </div>
                <div class="form-group">
                    <label>Gender:</label>
                    <select required name="gender">
                        <option value="">Select</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
            </div>
            
            <div class="form-section">
                <h3>Professional Details</h3>
                <div class="form-group">
                    <label>Specialization:</label>
                    <input type="text" required name="specialization">
                </div>
                <div class="form-group">
                    <label>License Number:</label>
                    <input type="text" required name="licenseNumber">
                </div>
                <div class="form-group">
                    <label>Experience (Years):</label>
                    <input type="number" required name="experienceYears">
                </div>
                <div class="form-group">
                    <label>Availability:</label>
                    <input type="text" required name="availability" placeholder="e.g., 9AM - 5PM">
                </div>
                <div class="form-group">
                    <label>Consultation Fees ($):</label>
                    <input type="number" step="0.01" required name="fees">
                </div>
            </div>
            
            <div class="form-section">
                <h3>Contact Details</h3>
                <div class="form-group">
                    <label>Phone Number:</label>
                    <input type="tel" required name="phoneNumber">
                </div>
                <div class="form-group">
                    <label>Email:</label>
                    <input type="email" required name="email">
                </div>
                <div class="form-group">
                    <label>Address:</label>
                    <input type="text" required name="address">
                </div>
                <div class="form-group">
                    <label>Location:</label>
                    <input type="text" required name="location">
                </div>
            </div>
            
            <div class="form-section">
                <h3>Security</h3>
                <div class="form-group">
                    <label>Password:</label>
                    <input type="password" required name="password">
                </div>
                <div class="form-group">
                    <label>Confirm Password:</label>
                    <input type="password" required name="confirmPassword">
                </div>
            </div>
            
            <div class="form-section">
                <h3>Profile Picture</h3>
                <div class="form-group">
                    <label>Upload Profile Picture:</label>
                    <input type="file" required name="img">
                </div>
            </div>
            
            <button type="submit" class="btn">Register</button>
        </form>
    </div>
</body>
</html>
