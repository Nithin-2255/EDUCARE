<!DOCTYPE html>
<html lang="en">
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

<style>
    body
      {
    display: flex;
    height: 100vh;
    flex-direction: column;
    row-gap: 10px;
    background: linear-gradient(135deg, #74ebd5, #acb6e5);
    font-family: 'Poppins', sans-serif;
    text-align: center;
    transition: opacity 1s ease-in-out;
}
header
{
   border-radius: 15px;
   display: flex;
   justify-content: space-between;
   background-color: white;
 }
 /* From Uiverse.io by mRcOol7 */ 
.Btn {
display: flex;
align-items: center;
justify-content: flex-start;
width: 40px;
height: 40px;
border: none;
border-radius: 50%;
cursor: pointer;
position: relative;
overflow: hidden;
transition-duration: 0.4s;
box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.2);
background:linear-gradient(135deg, #2ecc71, #00b894);
}

.sign {
width: 100%;
transition-duration: 0.4s;
display: flex;
align-items: center;
justify-content: center;
}

.sign svg {
width: 17px;
}

.sign svg path {
fill: white;
}

.text {
position: absolute;
right: 0%;
width: 0%;
opacity: 0;
color: #ecf0f1;
font-size: 1.2em;
font-weight: 600;
transition-duration: 0.4s;
}

.Btn:hover {
width: 130px;
border-radius: 20px;
transition-duration: 0.4s;
background:linear-gradient(135deg, #2ecc71, #00b894);
}

.Btn:hover .sign {
width: 30%;
transition-duration: 0.4s;
padding-left: 12px;
}

.Btn:hover .text {
opacity: 1;
width: 70%;
transition-duration: 0.4s;
padding-right: 10px;
}

.Btn:active {
transform: translate(2px, 2px);
box-shadow: 0 0 0 rgba(0, 0, 0, 0.2);
}

table {
    width:90%;
    border-collapse: collapse;
    font-family: Arial, sans-serif;
    box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
    margin-left: 50px;
    border-radius: 18px;
}
th, td {
    padding: 12px;
    text-align: left;
    border-bottom: 1px solid #ddd;
}
th {
    background:linear-gradient(135deg, #2ecc71, #00b894); 
    color: white;
}
tr:hover {
    background-color: #f1f1f1;
}
  .table-div
  {
    background-color: white;
    border-radius: 18px;
  }
 .bt1
 {
    background:linear-gradient(135deg, #2ecc71, #00b894); 
    border-radius: 5px;
    width: 100%;
    height: 100%;
    border-color: #00b894;
    color: white;
 }
 .bt1:hover
 {
    background: linear-gradient(135deg, #2ecc71, #00b894);
            transform: scale(1.05);
 }
  </style>
</head>
<body>
    <header> 
        <img src="img/midhunlogo final.png" alt="" width="200px"> 
        <button class="Btn" onClick="history.back()">
        <div class="sign">
          <svg viewBox="0 0 512 512">
            <path
              d="M377.9 105.9L500.7 228.7c7.2 7.2 11.3 17.1 11.3 27.3s-4.1 20.1-11.3 27.3L377.9 406.1c-6.4 6.4-15 9.9-24 9.9c-18.7 0-33.9-15.2-33.9-33.9l0-62.1-128 0c-17.7 0-32-14.3-32-32l0-64c0-17.7 14.3-32 32-32l128 0 0-62.1c0-18.7 15.2-33.9 33.9-33.9c9 0 17.6 3.6 24 9.9zM160 96L96 96c-17.7 0-32 14.3-32 32l0 256c0 17.7 14.3 32 32 32l64 0c17.7 0 32 14.3 32 32s-14.3 32-32 32l-64 0c-53 0-96-43-96-96L0 128C0 75 43 32 96 32l64 0c17.7 0 32 14.3 32 32s-14.3 32-32 32z"
            ></path>
          </svg>
        </div>
       <div class="text">Back</div>
      </button>
    </header>
    <div class="table-div">
        <table>
            <tr>
                <th>Patient Name</th>
                <th>Appointment date</th>
                <th>Appointment time</th>
                <th>Delete</th>
                <th>view</th>
            </tr>
            <tr th:each="item : ${list}">
                <td th:text="${item.Patient.patientName}" ></td>
                <td th:text="${item.date}"></td>
                <td th:text="${item.time}"></td>
                <td><a th:href="'deleteAppointment/'+${item.id}"><button class="bt1">Delete</button></a></td>
                <td><a th:href="'getProfileDetails/'+${item.Patient.id}+'/'+${item.doctor.id}" ><button class="bt1">view</button></a></td>
            </tr>
        </table>
    </div>
</body>
</html>
