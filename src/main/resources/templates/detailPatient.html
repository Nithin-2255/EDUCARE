<!DOCTYPE html>
<html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="ISO-8859-1">
    <title>Edit Patient Profile</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #74ebd5, #acb6e5);
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 20px;
            overflow-y: auto;
        }
        .profile-container {
            background: white;
            padding: 30px 20px;
            border-radius: 15px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            width: 90%;
            max-width: 500px;
            text-align: center;
        }
        .profile-img {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #3498db;
            margin-bottom: 20px;
        }
        h2 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        .info {
            text-align: left;
            margin-top: 20px;
        }
        .info h3 {
            color: #2c3e50;
            border-bottom: 2px solid #2c3e50;
            padding-bottom: 5px;
        }
        .info label {
            display: block;
            margin-top: 10px;
            color: #34495e;
            font-size: 14px;
        }
        .info input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }
        .save-btn {
            margin-top: 20px;
            padding: 10px;
            font-size: 16px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #3498db, #6dd5fa);
            color: white;
            cursor: pointer;
            width: 100%;
        }
        .save-btn:hover {
            transform: scale(1.05);
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>
    <div class="profile-container">
       <img th:src="@{'http://localhost:8080/download/' + ${data.imgId.id}}" alt="Patient Photo" class="profile-img">
        <h2><input type="text" th:value="${data.patientName}"></h2>

        <form action="/admin/patient/edit" method="post">
            <div class="info">
                 <input type="hidden" th:value="${data.patientName}" name="name">
                   <input type="hidden" th:value="${data.id}" name="id">
                <h3>Personal Details</h3>
                <label>Gender:</label>
                <input type="text" name="gender" th:value="${data.gender}">

                <label>Age:</label>
                <input type="number" name="age" th:value="${data.patientAge}">

                <label>Blood Group:</label>
                <input type="text" name="bloodgroup" th:value="${data.bloodGroup}">

                <h3>Contact Details</h3>
                <label>Address:</label>
                <input type="text" name="address" th:value="${data.address}">

                <label>Location:</label>
                <input type="text" name="location" th:value="${data.location}">

                <label>Phone No:</label>
                <input type="tel" name="phone" th:value="${data.phoneNo}">

                <label>Relative Name:</label>
                <input type="text" name="relativename" th:value="${data.relativeName}">

                <label>Relative Phone:</label>
                <input type="tel" name="relativephone" th:value="${data.relativePhone}">

                <label>Relation:</label>
                <input type="text" name="relation" th:value="${data.relation}">

                <h3>Security</h3>
                <label>Email:</label>
                <input type="email" name="email" th:value="${data.email}">
            </div>
            <button type="submit" class="save-btn">Save Changes</button>
        </form>
    </div>
</body>
</html>
