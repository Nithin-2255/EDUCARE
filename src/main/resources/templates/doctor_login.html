<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Login</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            background: linear-gradient(135deg, #74ebd5, #acb6e5);
            font-family: 'Poppins', sans-serif;
            text-align: center;
            transition: opacity 1s ease-in-out;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            animation: fadeIn 1s ease-in-out;
            width: 300px;
            margin-bottom: 12px;
        }
        h1 {
            margin-bottom: 14px;
            font-size: 22px; /* Increased */
            font-weight: bold;
            color: #2c3e50;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        input {
            width: 90%;
            padding: 10px ; /* Increased */
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 13px;
            font-size: 16px; /* Increased */
        }
        .btn {
            padding: 10px 20px; /* Increased */
            margin: 8px;
            font-size: 16px; /* Increased */
            border: none;
            cursor: pointer;
            border-radius: 30px;
            transition: 0.3s;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #2ecc71, #00b894);
            text-transform: uppercase;
            letter-spacing: 1px;
            width: 90%;
        }
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0px 3px 8px rgba(0, 0, 0, 0.3);
        }
        .link {
            display: block;
            margin-top: 8px;
            font-size: 14px; /* Increased */
            color: #2c3e50;
            text-decoration: none;
            font-weight: bold;
        }
        .link:hover {
            text-decoration: underline;
        }
        #loading {
            display: none;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }
        .loader {
            display: flex;
            justify-content: center;
        }
        .loader .dot {
            height: 10px; /* Increased */
            width: 10px; /* Increased */
            border-radius: 50%;
            background: #16b0c1;
            margin: 3px;
            animation: jump 0.8s ease-in-out infinite alternate;
        }
         .error {
    color: #fff;
    background-color: #ff4d4d;
    padding: 10px;
    border-radius: 5px;
    text-align: center;
    font-weight: bold;
    margin-bottom: 10px;
    }
        @keyframes jump {
            100% {
                background: #661e92;
                transform: translateY(-0.5rem) scale(1.2);
            }
        }
        .loader .dot:nth-child(1) { animation-delay: 0.1s; }
        .loader .dot:nth-child(2) { animation-delay: 0.2s; }
        .loader .dot:nth-child(3) { animation-delay: 0.3s; }
        .loader .dot:nth-child(4) { animation-delay: 0.4s; }
        .loader .dot:nth-child(5) { animation-delay: 0.5s; }
    </style>
</head>
<body>
    <div class="container" id="login-container">
    <center>  <img src="img/midhunlogo final.png" alt="" width="200px"> </center>
     <div class="error" th:if="${error != null}" th:text="${error}" >
                   
                    </div>
        <h1>Doctor Login</h1>
        <form action="/login" method="post">
        <input type="email" id="email" placeholder="Enter your email" name="user" required>
        <input type="password" id="password" placeholder="Enter your password" name="password" required>
        <input type="hidden" value="doctor" name="role">
        <button class="btn"  type="submit">Login</button>
        </form>
        <a th:href="@{/forgetpage}" class="link" >Forgot Password?</a>
        <a href="doctor_registation.html" class="link" >New Registration</a>
    </div>

    <div id="loading">
        <div class="loader">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
        <p style="font-size: 16px; font-weight: bold;">Authenticating...</p> <!-- Increased font -->
    </div>

    <script>
        function login() {
            document.getElementById('login-container').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('login-container').style.display = 'none';
                const loading = document.getElementById('loading');
                loading.style.display = 'block';
                setTimeout(() => {
                    loading.style.opacity = '1';
                }, 100);
            }, 1000);
            
        }
    </script>
</body>
</html>
