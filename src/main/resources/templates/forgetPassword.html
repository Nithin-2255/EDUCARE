<!DOCTYPE html>
<html lang="en">
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            background: linear-gradient(135deg, #74ebd5, #acb6e5);
            font-family: 'Poppins', sans-serif;
            text-align: center;
            transition: opacity 1s;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 3px 8px rgba(0, 0, 0, 0.2);
            animation: fadeIn 1s;
        }
    
        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 14px;
        }
        .btn {
            padding: 8px;
            font-size: 16px;
            border: none;
            cursor: pointer;
            border-radius: 50px;
            transition: 0.3s;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #2ecc71, #00b894);
            width: 100%;
        }
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.3);
        }
         .error {
    color: #fff;
    background-color: #ff4d4d;
    padding: 10px;
    border-radius: 5px;
    text-align: center;
    font-weight: bold;
    margin-bottom: 10px;
    }
        label {
            font-size: 14px;
            color: #2c3e50;
        }
    </style>
</head>
<body>
    <div class="container" id="main-container">
    <div class="error" th:if="${data['error']!= null}" th:text="${data['error']}">
                   
                    </div>
        <h4>Enter your Register Mail ID</h4>
         <form action="/password/sendOtp" method="post" th:if="${data['email']} != null" >
            <input type="email" required name="email" >
            <input type="submit" value="Genarate OTP" class="btn">
         </form>
         <form action="/password/otpCheck" method="post" th:if="${data['otp']} != null">
            <input type="text" name="otp" class="otp" placeholder="Enter otp">
         <h5>   <label>Password:</label></h5>
           <input type="password" required name="password" >
          <h5>  <label>Confirm Password:</label></h5>
            <input type="password" required >
            <input type="hidden" th:value="${data['otp']}" name=email>
            <input type="submit" class="btn" value="Change Password">
            
         </form>
    </div>
</body>
</html>
