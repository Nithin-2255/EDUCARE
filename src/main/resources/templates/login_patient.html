<!DOCTYPE html>
<html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="ISO-8859-1">
<title>Patient login</title>
<style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            background: linear-gradient(135deg, #74ebd5, #acb6e5);
            font-family: 'Poppins', sans-serif;
            text-align: center;
            transition: opacity 1s ease-in-out;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            animation: fadeIn 1s ease-in-out;
            width: 300px;
            margin-bottom: 12px;
        }
        h1 {
            margin-bottom: 12px;
            font-size: 22px;
            font-weight: bold;
            color: #2c3e50;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }
        input {
            width: 90%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 18px;
            font-size: 16px;
        }
        .btn {
            padding: 10px 20px;
            margin: 8px;
            font-size: 16px;
            border: none;
            cursor: pointer;
            border-radius: 30px;
            transition: 0.3s;
            font-weight: bold;
            color: white;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            width: 90%;
            background: linear-gradient(135deg, #3498db, #6dd5fa);
        }
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0px 3px 8px rgba(0, 0, 0, 0.3);
        }
        .link {
            display: block;
            margin-top: 8px;
            font-size: 14px;
            color: #2c3e50;
            text-decoration: none;
            font-weight: bold;
        }
        .link:hover {
            text-decoration: underline;
        }
        #loading {
            display: none;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }
        .loader {
            display: flex;
            justify-content: center;
        }
        .loader .dot {
            height: 10px;
            width: 10px;
            border-radius: 50%;
            background: #16b0c1;
            margin: 2px;
            animation: jump 0.8s ease-in-out infinite alternate;
        }
        .error {
    color: #fff;
    background-color: #ff4d4d;
    padding: 10px;
    border-radius: 5px;
    text-align: center;
    font-weight: bold;
    margin-bottom: 10px;
}
        
        @keyframes jump {
            100% {
                background: #661e92;
                transform: translateY(-0.5rem) scale(1.2);
            }
        }
        .loader .dot:nth-child(1) { animation-delay: 0.1s; }
        .loader .dot:nth-child(2) { animation-delay: 0.2s; }
        .loader .dot:nth-child(3) { animation-delay: 0.3s; }
        .loader .dot:nth-child(4) { animation-delay: 0.4s; }
        .loader .dot:nth-child(5) { animation-delay: 0.5s; }
    </style>
</head>
<body>
    <div class="container" id="patient-login">
    <center>  <img src="img/midhunlogo final.png" alt="" width="200px"> </center>
     <div class="error" th:if="${error != null}" th:text="${error}">
                   
                    </div>
        <h1>Patient Login</h1>
        <form action="/login" method="post">
       
        <input type="email" placeholder="Enter your email" required name="user">
        <input type="password" placeholder="Enter your password" required name="password">
        <input type="hidden" value="patient" name="role">
        <button class="btn" type="submit">Login</button>
        </form>
        <a th:href="@{/forgetpage}" class="link" >Forgot Password?</a>
        <a href="registationForm_patient.html" class="link" >New Registration</a>
    </div>

    <div id="loading">
        <div class="loader">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
        <p>Authenticating...</p>
    </div>
</body>
</html>
